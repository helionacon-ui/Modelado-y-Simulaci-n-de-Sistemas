<svg viewBox="0 0 640 262" role="img" aria-labelledby="arx-oet"><title id="arx-oet">Diferencia entre predecir con un modelo ARX, que usa la salida medida, y con un OE, que usa su propia predicción</title><rect x="90" y="98" width="120" height="70" rx="8" class="s-acc" style="fill:var(--accent-soft)"/><text x="150.0" y="138.0" text-anchor="middle" class="s-tx">ARX</text><text x="12" y="66" text-anchor="start" class="s-it">u(k−1)…</text><path d="M60 72 Q80 100 90 118" class="s-thin" marker-end="url(#ah)"/><text x="12" y="224" text-anchor="start" class="s-it">y(k−1)… real</text><path d="M60 212 Q80 170 90 150" class="s-thin" marker-end="url(#ah)"/><path d="M210 133 H262" class="s-thin" marker-end="url(#aha)"/><text x="262" y="120" text-anchor="end" class="s-it">ŷ(k)</text><rect x="420" y="98" width="120" height="70" rx="8" class="s-acc" style="fill:var(--accent-soft)"/><text x="480.0" y="138.0" text-anchor="middle" class="s-tx">OE</text><text x="342" y="66" text-anchor="start" class="s-it">u(k−1)…</text><path d="M390 72 Q410 100 420 118" class="s-thin" marker-end="url(#ah)"/><text x="342" y="224" text-anchor="start" class="s-it">ŷ(k−1)… predicha</text><path d="M390 212 Q410 170 420 150" class="s-thin" marker-end="url(#ah)"/><path d="M540 133 H592" class="s-thin" marker-end="url(#aha)"/><text x="592" y="120" text-anchor="end" class="s-it">ŷ(k)</text><text x="150" y="32" text-anchor="middle" class="s-tx">ARX: realimenta lo MEDIDO</text><text x="480" y="32" text-anchor="middle" class="s-tx">OE: realimenta lo PREDICHO</text><path d="M320 14 V250" class="s-thin" stroke-dasharray="4 5"/><text x="150" y="248" text-anchor="middle" class="s-tx2">corrige con la salida real en cada paso</text><text x="480" y="248" text-anchor="middle" class="s-tx2">el modelo corre solo con la entrada</text></svg>