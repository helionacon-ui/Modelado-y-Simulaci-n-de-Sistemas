<svg viewBox="0 0 640 205" role="img" aria-labelledby="estabilidadt"><title id="estabilidadt">Zonas del factor 1 más lambda por h: decae, decae oscilando y diverge</title><path d="M30 110 H620" class="s-ln"/><rect x="30" y="84" width="160" height="52" fill="var(--c-ter)" opacity=".25"/><text x="110.0" y="106" text-anchor="middle" class="s-tx">diverge oscilando</text><text x="110.0" y="126" text-anchor="middle" class="s-tx2">h > 2/|λ|</text><rect x="190" y="84" width="140" height="52" fill="var(--c-mec)" opacity=".25"/><text x="260.0" y="106" text-anchor="middle" class="s-tx">decae oscilando</text><text x="260.0" y="126" text-anchor="middle" class="s-tx2">1/|λ| < h < 2/|λ|</text><rect x="330" y="84" width="140" height="52" fill="var(--c-ctl)" opacity=".25"/><text x="400.0" y="106" text-anchor="middle" class="s-tx">decae sin oscilar</text><text x="400.0" y="126" text-anchor="middle" class="s-tx2">h < 1/|λ|</text><path d="M190 78 V142" class="s-ln"/><text x="190" y="164" text-anchor="middle" class="s-it">−1</text><path d="M330 78 V142" class="s-ln"/><text x="330" y="164" text-anchor="middle" class="s-it">0</text><path d="M470 78 V142" class="s-ln"/><text x="470" y="164" text-anchor="middle" class="s-it">1</text><text x="330" y="40" text-anchor="middle" class="s-tx">Factor de amplificación 1 + λh (λ < 0)</text><text x="330" y="64" text-anchor="middle" class="s-tx2">Con Euler, w(k) = (1 + λh)ᵏ · w(0): la solución numérica solo tiende a 0 si |1 + λh| < 1</text><text x="330" y="192" text-anchor="middle" class="s-tx">Estable: −1 < 1 + λh < 1, es decir, h < 2/|λ|</text></svg>