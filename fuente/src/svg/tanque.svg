<svg viewBox="0 0 640 305" role="img" aria-labelledby="tanquet"><title id="tanquet">Tanque con caudal de entrada y válvula de salida de apertura a, con la ecuación de la altura</title><rect x="210" y="70" width="150" height="190" class="s-box" style="fill:none"/><rect x="212" y="150" width="146" height="108" class="s-water"/><path d="M212 150 H358" class="s-acc"/><path d="M70 52 H200 Q232 52 232 92" class="s-thin" marker-end="url(#aha)"/><text x="70" y="42" text-anchor="start" class="s-tx">caudal de entrada fᵢ</text><text x="70" y="74" text-anchor="start" class="s-tx2">15 l/min</text><path d="M360 244 H430" class="s-ln"/><path d="M430 224 V244 M418 224 H442" class="s-ln"/><circle cx="430" cy="244" r="6" fill="var(--accent)"/><text x="452" y="212" text-anchor="start" class="s-tx">válvula, apertura a</text><text x="452" y="230" text-anchor="start" class="s-tx2">a₀ = 50 %</text><path d="M436 244 H520" class="s-thin" marker-end="url(#aha)"/><text x="526" y="249" text-anchor="start" class="s-tx">fₒ = K·a·√h</text><path d="M382 150 V258" class="s-thin" marker-end="url(#ah)" marker-start="url(#ah)"/><text x="390" y="205" text-anchor="start" class="s-it">h</text><text x="285" y="100" text-anchor="middle" class="s-it">S = πr²</text><text x="285" y="120" text-anchor="middle" class="s-tx2">r = 15 cm</text><text x="285" y="140" text-anchor="middle" class="s-tx2">h₀ = 25 cm</text><text x="285" y="288" text-anchor="middle" class="s-tx">S·dh/dt = fᵢ − K·a·√h</text></svg>