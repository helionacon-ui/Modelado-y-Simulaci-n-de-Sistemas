<svg viewBox="0 0 640 235" role="img" aria-labelledby="simuladort"><title id="simuladort">Bucle de un simulador: entrada, controlador, derivadas, integrador y realimentación del estado</title><rect x="20" y="90" width="110" height="56" rx="8" class="s-box"/><text x="75.0" y="123.0" text-anchor="middle" class="s-tx">Entrada u(t)</text><rect x="170" y="90" width="130" height="56" rx="8" class="s-acc" style="fill:var(--accent-soft)"/><text x="235.0" y="123.0" text-anchor="middle" class="s-tx">Controlador</text><rect x="340" y="90" width="130" height="56" rx="8" class="s-box"/><text x="405.0" y="123.0" text-anchor="middle" class="s-tx">Derivadas f(x,u)</text><rect x="510" y="90" width="110" height="56" rx="8" class="s-box"/><text x="565.0" y="123.0" text-anchor="middle" class="s-tx">Integrador</text><path d="M130 118 H168" class="s-thin" marker-end="url(#ah)"/><path d="M300 118 H338" class="s-thin" marker-end="url(#ah)"/><path d="M470 118 H508" class="s-thin" marker-end="url(#aha)"/><path d="M565 146 V200 H235 V148" class="s-thin" marker-end="url(#ah)" fill="none"/><text x="400" y="218" text-anchor="middle" class="s-tx2">estado x(k+1) = x(k) + h·(pendiente)</text><path d="M565 90 V50" class="s-thin" marker-end="url(#ah)"/><text x="565" y="40" text-anchor="middle" class="s-tx2">guardar salidas y(k)</text><text x="75" y="76" text-anchor="middle" class="s-tx2">t = t + h</text><text x="235" y="76" text-anchor="middle" class="s-tx2">cada paso o cada Tc</text></svg>