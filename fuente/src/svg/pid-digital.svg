<svg viewBox="0 0 640 232" role="img" aria-labelledby="pid-digitalt"><title id="pid-digitalt">Lazo de control por computador: muestreo, PID digital, retenedor de orden cero y planta continua</title><text x="28" y="122" text-anchor="middle" class="s-it">r(t)</text><path d="M52 118 H92" class="s-thin" marker-end="url(#ah)"/><circle cx="106" cy="118" r="14" class="s-box"/><text x="106" y="123" text-anchor="middle" class="s-tx">Σ</text><path d="M120 118 H150" class="s-thin" marker-end="url(#ah)"/><rect x="150" y="92" width="92" height="52" rx="8" class="s-box"/><text x="196.0" y="123.0" text-anchor="middle" class="s-tx">muestreo Tc</text><path d="M242 118 H272" class="s-thin" marker-end="url(#ah)"/><rect x="272" y="92" width="92" height="52" rx="8" class="s-acc" style="fill:var(--accent-soft)"/><text x="318.0" y="123.0" text-anchor="middle" class="s-tx">PID digital</text><path d="M364 118 H394" class="s-thin" marker-end="url(#ah)"/><rect x="394" y="92" width="76" height="52" rx="8" class="s-box"/><text x="432.0" y="123.0" text-anchor="middle" class="s-tx">ZOH</text><path d="M470 118 H500" class="s-thin" marker-end="url(#ah)"/><rect x="500" y="92" width="80" height="52" rx="8" class="s-box"/><text x="540.0" y="123.0" text-anchor="middle" class="s-tx">planta</text><path d="M580 118 H622" class="s-thin" marker-end="url(#aha)"/><text x="612" y="100" text-anchor="end" class="s-it">y(t)</text><path d="M600 118 V190 H106 V133" class="s-thin" marker-end="url(#ah)"/><circle cx="600" cy="118" r="3.5" fill="var(--fg)"/><text x="350" y="212" text-anchor="middle" class="s-tx2">realimentación de la salida medida</text><text x="196" y="78" text-anchor="middle" class="s-tx2">k·Tc</text><text x="318" y="78" text-anchor="middle" class="s-it">u(k)</text><text x="432" y="78" text-anchor="middle" class="s-tx2">u(t) constante</text><text x="318" y="40" text-anchor="middle" class="s-tx">El controlador solo actúa cada Tc = n·h; entre dos instantes la salida se mantiene</text></svg>